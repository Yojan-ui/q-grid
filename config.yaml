# Q-Grid configuration — RVCE campus (Mysuru Road, Bengaluru).
# Labels: ASSUMPTION = engineering assumption (not measured); PENDING = awaiting an official/RVCE source.
# Real data: NASA POWER (irradiance/temperature), Ausgrid Solar Home (hostel load shape), OSM (layout).

site:
  name: "RV College of Engineering, Mysuru Road, Bengaluru"
  lat: 12.9232
  lon: 77.5006
  year: 2023
  slot_minutes: 15

campus:
  display_name: "RVCE"
  osm_name: "R. V. College of Engineering"
  slug: rvce
  pv: {usable_roof_frac: 0.45, kwp_per_m2: 0.18}      # ASSUMPTION: 45 % of roof usable, 180 Wp/m2 modules
  tie_lines: {max_degree: 3, extra_links: 2, step_kw: 120}   # ASSUMPTION: flow levels {-120, 0, +120} kW
  # ---- campus rescale to RVCE's own estate (backend/qgrid/v2/campus_scale.py; applied in qgrid/datasets.py "rvce").
  # Figures: "team brief, RVCE estate data pending" unless a document is named. Table: docs/data_verification.md.
  rescale: {enabled: true}
  asset_status: {pv: EXISTING, dg: EXISTING, battery: PROPOSED, ev: PROPOSED, cables: PROPOSED}
  facts:
    status: TEAM BRIEF
    source: "team brief, RVCE estate data pending"
    built_up_m2: 67721               # TEAM BRIEF: built-up area of RVCE's own buildings
    built_up_includes_hostels: false # ASSUMPTION / OPEN QUESTION: brief does not say whether 67,721 m2 includes hostels
    hostel_zone: hostels
    boys_hostels_m2: 38659           # TEAM BRIEF
    boys_hostel_beds: 1450           # TEAM BRIEF (metadata; loads still floor area x EPI)
  pv_existing:                       # replaces roof area x usable fraction x kWp/m2 for the RVCE case study
    status: TEAM BRIEF
    source: "team brief, RVCE estate data pending"
    roofs: 21
    modules: 1564
    module_wp: 320                   # 1,564 x 320 Wp = 500.48 kWp
    total_kwp: 500.48
    allocation: "footprint x pv_roof share per zone (ASSUMPTION: the 21 roofs are not identified)"
  dg_sets:                           # 980 kVA in two sets; host = zone where the set is modelled, backs = zones it feeds
    status: TEAM BRIEF
    source: "team brief, RVCE estate data pending"
    total_kva: 980
    rated_pf: 0.8                    # ASSUMPTION: genset kW rating = kVA x 0.8 (usual rating convention)
    operating: {min_load_frac: 0.3, min_on_slots: 4}   # ASSUMPTIONS (as before)
    sets:                            # ASSUMPTION: the 490 + 490 kVA split and the host/backs mapping are not in the brief
      - {name: DG-1, kva: 490, host: hostels, backs: [hostels, health_centre, pumping_station]}
      - {name: DG-2, kva: 490, host: admin, backs: [admin, server_room, library]}
  osm_exclude:                       # OSM buildings inside the RVCE outline that are not RVCE's (RV University = RVU)
    - {osm_id: way/1286468169, name: "RVU Block", reason: "RV University building (OSM name), not RVCE"}
    - {osm_id: way/1286468170, name: "RVU A Block", reason: "RV University building (OSM name), not RVCE"}
    - {osm_id: way/1313225782, name: "RVU C Block", reason: "RV University building (OSM name), not RVCE"}
    - {osm_id: way/1467210438, name: "RVU Admin Block", reason: "RV University building (OSM name), not RVCE"}
  # first matching rule wins (regex on OSM name / tags); exclude=true drops the feature
  zone_rules:
    - {exclude: true, tags: {building: "construction|roof|garage"}}
    - {exclude: true, tags: {leisure: "."}}
    - {exclude: true, tags: {amenity: "parking|motorcycle_parking"}}
    - {zone: server_room, name_regex: "computing hub|data ?cent|server"}
    - {zone: health_centre, tags: {amenity: "hospital|clinic|doctors"}}
    - {zone: health_centre, name_regex: "medical|health"}
    - {zone: hostels, name_regex: "hostel|quarters"}
    - {zone: library, tags: {amenity: "library"}}
    - {zone: library, name_regex: "library"}
    - {zone: canteen, tags: {amenity: "fast_food|restaurant|cafe|food_court"}}
    - {zone: canteen, name_regex: "food|canteen|mingos"}
    - {zone: admin, name_regex: "admin"}
    - {zone: heavy_labs, name_regex: "mechanical|workshop|industrial|civil|chemical|aerospace|pg lab|kriya"}
    - {zone: academic, tags: {building: "."}}
  # per-zone ASSUMPTIONS: levels (if OSM has no building:levels), EPI kWh/m2/yr of floor area,
  # critical share of load, battery, diesel generator, flexible loads.
  # Status per asset type: campus.asset_status. Batteries, EV chargers (ev_charging flex job) and inter-building
  # cables (tie-lines) are PROPOSED, not installed; PV and DG exist. Battery sizes below are PROPOSED (ASSUMPTION).
  zones:
    academic:
      levels: 3
      epi_kwh_m2_yr: 60
      profile: academic
      critical_frac: 0.05
      battery: {kwh: 400, kw: 200}
      flex:
        - {name: ev_charging, kw: 44, slots: 12, earliest: "08:00", latest: "15:00", default: "09:00"}
        - {name: auditorium_precool, kw: 60, slots: 4, earliest: "11:00", latest: "16:00", default: "16:00"}
      fest_load: {kw: 150, start: "17:00", end: "22:30"}   # ASSUMPTION: stage, lighting, sound
    heavy_labs:
      levels: 2
      epi_kwh_m2_yr: 90
      profile: labs
      critical_frac: 0.05
      battery: {kwh: 200, kw: 100}
      flex:
        - {name: heavy_lab_machines, kw: 60, slots: 8, earliest: "09:00", latest: "14:00", default: "10:00"}
    hostels:
      levels: 4
      epi_kwh_m2_yr: 45
      profile: hostel          # Ausgrid residential shape (real data), scaled
      critical_frac: 0.10
      battery: {kwh: 300, kw: 150}
      dg: {kw: 392, min_load_frac: 0.3, min_on_slots: 4}   # = campus.dg_sets DG-1: 490 kVA x 0.8
      flex:
        - {name: water_heaters, kw: 60, slots: 8, earliest: "01:00", latest: "04:00", default: "04:00"}
        - {name: laundry, kw: 25, slots: 8, earliest: "08:00", latest: "18:00", default: "18:00"}
    library:
      levels: 3
      epi_kwh_m2_yr: 70
      profile: library
      critical_frac: 0.05
      battery: {kwh: 150, kw: 75}
      flex:
        - {name: hvac_precool, kw: 25, slots: 4, earliest: "08:00", latest: "15:00", default: "15:00"}
    canteen:
      levels: 1
      epi_kwh_m2_yr: 150
      profile: canteen
      critical_frac: 0.15
      battery: {kwh: 100, kw: 50}
      flex:
        - {name: cold_storage_cycle, kw: 15, slots: 6, earliest: "00:00", latest: "16:00", default: "16:00"}
    admin:
      levels: 3
      epi_kwh_m2_yr: 80
      profile: office
      critical_frac: 0.10
      battery: {kwh: 150, kw: 75}
      dg: {kw: 392, min_load_frac: 0.3, min_on_slots: 4}   # = campus.dg_sets DG-2: 490 kVA x 0.8
    server_room:
      levels: 2
      epi_kwh_m2_yr: 1200
      profile: flat
      critical_frac: 1.0
      battery: {kwh: 120, kw: 60}         # UPS bank
      pv_roof: 1.0
    health_centre:
      levels: 1
      epi_kwh_m2_yr: 150
      profile: health
      critical_frac: 0.8
      battery: {kwh: 40, kw: 20}
    pumping_station:
      profile: none
      critical_frac: 0.0
      pv_roof: 0.0
      virtual: {x_m: 180.0, y_m: 120.0, floor_m2: 60}   # ASSUMPTION: pump house not mapped in OSM
      tank: {capacity_m3: 300, level0_frac: 0.6, min_frac: 0.15, max_frac: 0.98,
             pump_kw: 30, pump_m3_per_slot: 8.0, daily_demand_m3: 320}   # ASSUMPTIONS

loads:
  source: bdg2              # bdg2 (real meter shapes, data/raw/bdg2) | templates (configs/profiles.yaml + Ausgrid hostels)

bdg2:                       # zone -> BDG2 primary / sub use (metadata.csv); zones not listed keep their profile
  zones:
    academic:      {primary: Education, subs: [College Classroom, Academic, Classroom]}
    heavy_labs:    {primary: Education, subs: [College Laboratory, Research]}
    hostels:       {primary: Lodging/residential, subs: [Dormitory, Residence Hall]}
    library:       {primary: Public services, subs: [Library]}
    canteen:       {primary: Education, subs: [Student Union]}
    admin:         {primary: Office, subs: [Office]}
    health_centre: {primary: Healthcare, subs: [Hospital, Patient Care]}
  # server_room keeps a flat profile (no data-centre building in BDG2: ASSUMPTION); pumping_station has no own load

pv_model: {noct_c: 45.0, gamma_per_c: -0.004, system_derate: 0.86}

battery_defaults: {soc_min: 0.20, soc_max: 0.95, soc0: 0.50, eta_ch: 0.95, eta_dis: 0.95}

diesel:                       # ASSUMPTIONS (generic linear fuel curve; replace with RVCE DG logs)
  price_rs_per_l: 90.0
  fuel_l_per_kwh_rated: 0.08  # L/h per kW rated (no-load intercept)
  fuel_l_per_kwh_out: 0.25    # L per kWh delivered
  co2_kg_per_l: 2.68

outage_costs:                 # ASSUMPTIONS: value of lost load used only inside optimisation objectives
  voll_noncritical_rs_kwh: 40
  voll_critical_rs_kwh: 1000

economics:                    # ASSUMPTIONS for payback / per-semester figures
  battery_capex_rs_per_kwh: 25000
  battery_cycle_life: 4000      # ASSUMPTION: full cycles to end of life (LFP datasheet class), for degradation cost
  discount_rate: 0.08           # ASSUMPTION: for the 10-year NPV of savings
  semester_days: 120

battery_wear:                 # battery wear priced in every optimiser's objective and in the scored objective
  in_objective: true          # Rs per kWh charged or discharged = economics.battery_capex / (2 x cycle life x DoD)
  depth_of_discharge: 0.75    # ASSUMPTION (same as the degradation metric)

impact:                       # "Is it worth it?" (scripts/write_impact.py). Every value is an ASSUMPTION unless a source is
                              # given; [low, high] ranges are sampled uniformly in the Monte Carlo. Vendor quotes are PENDING.
  status: ASSUMPTION
  per_building:               # incremental hardware for one building's Q-Grid node (the controller runs on it)
    edge_controller_rs: [15000, 40000]   # ASSUMPTION: industrial single-board computer / small IPC, quote PENDING
    energy_meter_rs: [8000, 20000]       # ASSUMPTION: three-phase Modbus meter with CT set, quote PENDING
    network_rs: [3000, 10000]            # ASSUMPTION: switch / Wi-Fi bridge and cabling, quote PENDING
    integration_rs: [20000, 60000]       # ASSUMPTION: electrician + commissioning (BMS / battery / DG interfaces), PENDING
  om_share_per_year: [0.05, 0.15]        # ASSUMPTION: maintenance and software upkeep as a share of hardware cost
  discount_rate: [0.06, 0.10]            # ASSUMPTION (central value 0.08 = economics.discount_rate)
  years: 10
  battery_capex_rs_per_kwh: [15000, 25000]  # ASSUMPTION: LFP pack + inverter share; upper end = economics.battery_capex
  battery_cycle_life: [3000, 6000]          # ASSUMPTION: LFP datasheet class; central 4000 = economics.battery_cycle_life
  battery_dod: 0.75                         # ASSUMPTION (same as the benchmark's degradation metric)
  monte_carlo: {samples: 10000, seed: 2026}

# ----------------------------------------------------------------------------- prices
prices:
  scenarios: [A, B]
  A:
    status: PENDING
    role: headline
    source: "KERC tariff order: BESCOM HT educational institutions (ToD) import; KERC solar net-metering/feed-in rate export"
    standin_note: "STAND-IN placeholder rates, NOT taken from a KERC/BESCOM document"
    import_base_rs_kwh: 8.00
    tod:
      - {start: "06:00", end: "10:00", adder: 1.00}
      - {start: "18:00", end: "22:00", adder: 1.00}
      - {start: "22:00", end: "06:00", adder: -1.00}
    export_rs_kwh: 3.00
    pages: {}                 # fill with page numbers of the KERC PDFs when REAL
  B:
    status: PENDING
    role: sensitivity
    source: "IEX DAM 15-min MCP (all-India), import and export at MCP"
    export_price_factor: 1.0
    standin_note: "SYNTHETIC STAND-IN daily price shape (IEX files missing)"
    standin_profile_rs_kwh:
      - {start: "00:00", end: "06:00", price: 4.50}
      - {start: "06:00", end: "09:00", price: 6.00}
      - {start: "09:00", end: "16:00", price: 3.00}
      - {start: "16:00", end: "18:00", price: 6.00}
      - {start: "18:00", end: "23:00", price: 10.00}
      - {start: "23:00", end: "24:00", price: 6.00}

co2:
  status: VERIFIED            # checked against the CEA PDFs below (data/raw/cea/, SHA-256 in data/SOURCES.md)
  tco2_per_mwh: 0.727
  standin_tco2_per_mwh: 0.727   # kept under the old key: qgrid/data.py load_co2_factor() reads this name
  standin_note: >-
    CEA CO2 Baseline Database for the Indian Power Sector, User Guide v20.0 (Dec 2024), Table S, PDF page 4: weighted
    average emission factor of the Indian grid, FY2023-24 (incl. RES and captive injection) = 0.727 tCO2/MWh.
    Unchanged in v21.0 (Nov 2025), Annexure-I, printed page 21 (PDF 27), after final captive data.
  source: "CEA CO2 Baseline Database User Guide v20.0, Table S (PDF p.4); v21.0 Annexure-I (p.21)"
  by_fy:                      # VERIFIED, v21.0 Annexure-I p.21 [27]; the model year 2023 spans FY2022-23 (Jan-Mar)
    "2022-23": 0.716
    "2023-24": 0.727
  lambda_rs_per_kg: 0.0

# ----------------------------------------------------------------------------- calendar & scenarios
calendar:                     # PENDING RVCE academic calendar (rvce.edu.in blocks scripted download)
  status: PENDING
  note: "Teaching/exam/vacation windows are PLACEHOLDERS; fest dates from RVCE cultural activities report."
  fest: [["2023-06-13", "2023-06-15"]]            # sourced: RVCE reports (8th Mile, 13-15 June 2023)
  exams: [["2023-03-27", "2023-04-08"], ["2023-07-03", "2023-07-22"], ["2023-12-11", "2023-12-23"]]
  vacation: [["2023-07-24", "2023-09-01"], ["2023-12-24", "2023-12-31"]]
  # everything else on weekdays = teaching; Sat/Sun = holiday profile

scenarios:
  teaching:     {date: "2023-09-13", note: "PLACEHOLDER teaching Wednesday (PENDING calendar)"}
  exam_week:    {date: "2023-07-12", note: "PLACEHOLDER exam-week Wednesday (PENDING calendar)"}
  vacation:     {date: "2023-08-09", note: "PLACEHOLDER vacation Wednesday (PENDING calendar)"}
  fest:         {date: "2023-06-14", note: "8th Mile fest day 2 (RVCE report)"}
  monsoon:      {date: auto, note: "lowest campus PV day Jun-Sep 2023 (NASA POWER)"}
  outage_fest:  {date: "2023-06-15", outage: ["18:00", "21:00"],
                 note: "HEADLINE stress test: BESCOM outage 18:00-21:00 during fest evening peak (ASSUMED outage window)"}
headline_scenario: outage_fest

test_days:
  n_eval_days: 30

admm:
  rho: 0.25
  rho_growth: 1.2
  relax: 1.0                  # over-relaxation of z (1.0 = none); damping < 1
  max_iter: 15
  neighbour_timeout_s: 3.0
  horizon_slots: 3
  bilateral_resolution: true  # disagreeing lines: each end reports its cost at the 3 levels; pick the min sum

qaoa:
  p: 2
  shots: 256
  seed: 1234
  warm_start_iters: 6         # COBYLA refinement steps from the zone's previous parameters

rules_dir: rules

# ----------------------------------------------------------------------------- optimiser v2
tariff_v2:                    # demand charge on the campus peak (one HT connection; kVA = kW / pf)
  status: PENDING
  source: "BESCOM HT educational institutions: demand charge Rs/kVA/month on recorded maximum demand (KERC tariff order)"
  standin_note: "STAND-IN placeholder demand charge, NOT taken from a BESCOM/KERC document"
  demand_rs_per_kva_month: 350.0
  power_factor: 0.95          # ASSUMPTION
  days_per_month: 30          # ASSUMPTION: daily figures carry 1/30 of the monthly charge on the day's peak kVA
  pages: {}

# ----------------------------------------------------------------------------- HT-2(c)(ii) tariff (monthly billing)
# Read by backend/qgrid/v2/tariff.py (ht2c_params, order_for, energy_price_slots, monthly_bill).
# Every value carries its source; page numbers are the PRINTED page numbers of the cited PDF (PDF page in brackets).
# Raw PDFs + SHA-256: data/SOURCES.md. Full table: docs/data_verification.md.
#   TO-2022 = KERC Tariff Order 2022 (BESCOM), dated 04.04.2022, Annexure-5 "Electricity Tariff-2023", effective from
#             the first meter-reading date on or after 01.04.2022 (data/raw/tariff/bescom_tariff_2023.pdf, p.375 [1]).
#   TO-2023 = KERC Tariff Order 2023 (BESCOM), dated 12.05.2023, effective from the first meter-reading date on or after
#             01.04.2023 (BESCOM public notice, data/raw/tariff/bescom_tariff_order_2023_highlights.pdf). Its rate
#             schedule PDF ("Electricity Tariff-2024") is NOT in the repo: FY2023-24 values are TEAM BRIEF / PENDING.
#
# ENERGY CHARGE FLAG FOR THE LEAD: the team brief says Rs 8.50/kWh; secondary sources say ~Rs 7.5-7.9/kWh.
#   TO-2022 (FY2022-23) HT-2(c)(ii), p.412 [38]: 825 paise/unit for the first one lakh units, 865 paise for the balance
#   (two slabs) -> neither 8.50 nor 7.5-7.9. The ~7.25/7.65 slabs belong to HT-2(c)(i) (government/aided institutions,
#   hostels of all educational institutions, p.411 [37]), which may be where the "7.5-7.9" figure comes from.
#   8.50 is kept ONLY for the FY2023-24 order and is unverified until the TO-2023 rate schedule is checked.
# DEMAND CHARGE FLAG: TO-2022 HT-2(c)(ii) is Rs 265/kVA/month (p.412 [38]), not the brief's Rs 350 (350 is kept for
#   FY2023-24 as TEAM BRIEF, PENDING).
tariff_ht2c:
  status: PENDING            # REAL only if every value below is checked against the PDF with a page number
  category: "HT-2(c)(ii) educational institutions"
  category_note: >-
    HT-2(c)(ii) = hospitals and educational institutions other than HT-2(c)(i) (TO-2022 p.412 [38]). HT-2(c)(i) covers
    government/local-body and aided institutions and hostels of all educational institutions (p.411 [37]); whether
    RVCE (private, aided status not checked) and its hostels are billed under (ii) needs an RVCE bill. PENDING RVCE bill.
  orders:                    # date-dependent; order_for() picks the one with valid_from <= date <= valid_to
    - valid_from: "2022-04-01"
      valid_to: "2023-03-31"
      energy_rs_kwh: 8.65    # marginal rate = "balance units" slab (campus import is far above one lakh units/month)
      energy_slabs:          # used by monthly_bill(); VERIFIED TO-2022 p.412 [38]
        - {upto_kwh: 100000, rs_kwh: 8.25}
        - {upto_kwh: null, rs_kwh: 8.65}
      demand_rs_kva_month: 265     # VERIFIED TO-2022 p.412 [38] (the brief's 350 does NOT match this order)
      tod_min_contract_kva: 0      # TO-2022 states ToD for HT-2(a)/(b)/(c) with no demand threshold (p.412 [38]);
                                   # peak +100 paise Dec-Jun "applicable to all the HT consumers" (p.408 [34], note 11)
      source: "KERC Tariff Order 2022 (BESCOM), dated 04.04.2022, Annexure-5 Electricity Tariff-2023, HT-2(c)(ii)"
      file: data/raw/tariff/bescom_tariff_2023.pdf
      page: 412
      status: VERIFIED
    - valid_from: "2023-04-01"
      valid_to: "2024-03-31"
      energy_rs_kwh: 8.50          # TEAM BRIEF, NOT VERIFIED (see flag above); no slab structure known
      demand_rs_kva_month: 350     # TEAM BRIEF, NOT VERIFIED
      tod_min_contract_kva: null   # null -> tod.min_contract_kva (500 kVA, TEAM BRIEF)
      source: "KERC Tariff Order 2023 (BESCOM), dated 12.05.2023, HT-2(c)(ii) (rate schedule PDF missing)"
      file: null
      page: null
      status: PENDING
  tod:                       # hours are [start, end) local time; offpeak wraps midnight
    months: [12, 1, 2, 3, 4, 5, 6]   # VERIFIED TO-2022 p.412 [38]: Dec-Jun; Jul-Nov (monsoon) 0
    peak_hours: [18, 22]
    peak_adder_rs_kwh: 1.00          # VERIFIED TO-2022 p.412 [38]: (+) 100 paise
    offpeak_hours: [22, 6]
    offpeak_adder_rs_kwh: -1.00      # VERIFIED TO-2022 p.412 [38]: (-) 100 paise (not for Special Incentive Scheme, p.408)
    min_contract_kva: 500            # TEAM BRIEF (not found in TO-2022; check TO-2023)
  export_rs_kwh: 3.74        # TEAM BRIEF, PENDING: KERC rooftop solar tariff order not in the repo
  billing_demand_floor_frac: 0.85    # VERIFIED TO-2022 p.404 [30] cond. 1(A): max(recorded MD, 85 % of CD)
  excess_demand_multiplier: 2.0      # VERIFIED TO-2022 p.404 [30] cond. 1(D): excess over CD at two times the rate
  round_billing_demand: true         # VERIFIED TO-2022 p.405 [31] cond. 1(G): >= 0.5 kVA rounds up, < 0.5 ignored
  power_factor: 0.95         # ASSUMPTION (TO-2022 p.405 [31]: specified PF 0.90, 3 paise/unit surcharge per 0.01 below)
  contract_demand_kva: 1300  # TEAM BRIEF / ASSUMPTION, PENDING RVCE bill
  contract_demand_sweep: [1000, 1300, 1600]
  billing_month: calendar    # ASSUMPTION: BESCOM bills meter-reading date to meter-reading date
  not_modelled: >-
    Electricity tax 9 % ad valorem (GoK notification 24 of 19.07.2018, BESCOM 'Other tariff related issues FY-23'
    p.3), fuel-cost adjustment (quarterly KERC orders), PF surcharge, Special Incentive / Discounted Energy Rate schemes.

v2:
  horizon_slots: 96           # 24 h rolling horizon, re-planned every slot (MPC)
  block_slots: 4              # one on/off decision per device per hour of the horizon
  dg_min_off_slots: 4         # ASSUMPTION: 1 h minimum down time (min up time: diesel.min_on_slots per zone)
  benders: {rel_gap: 0.005, max_iter: 6, master_every_slots: 4, trust_radius0: 3}
  admm: {rho: 0.02, max_iter: 300, tol_kw: 1.0, tol_rel: 0.001}
  forecast: {blend_tau_slots: 16}
  master: {max_block_qubits: 16, sweeps: 2}
  qaoa: {p: 2, shots: 256, seed: 1234}
  hardware:                   # optional, needs the team lead's tokens; never runs without explicit opt-in
    ibm: {env_token: QGRID_IBM_TOKEN, opt_in: QGRID_ALLOW_IBM, n_samples: 8}
    dwave: {env_token: DWAVE_API_TOKEN, opt_in: QGRID_ALLOW_DWAVE}
