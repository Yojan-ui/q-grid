[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgrid"
version = "0.1.0"
description = "Decentralised, QAOA-optimised scheduling for campus solar+battery microgrids"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "qiskit>=1.2,<3",
  "qiskit-aer>=0.15",
  "qiskit-optimization>=0.6",
  "pulp>=2.8",
  "highspy>=1.7",
  "osqp>=1.0",
  "pymoo>=0.6.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pyyaml>=6",
  "requests>=2.31",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]
ibm = ["qiskit-ibm-runtime>=0.25"]
dwave = ["dwave-system>=1.24"]

[tool.setuptools]
package-dir = { "qgrid" = "backend/qgrid", "baselines" = "baselines" }
packages = ["qgrid", "qgrid.solvers", "qgrid.v2", "baselines"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
pythonpath = ["backend", "."]
timeout = 300
